name: Coverage

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CEF_PATH: ${{ github.workspace }}/cef

jobs:
  coverage:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust and CEF
        uses: ./.github/actions/setup-rust-cef
        with:
          target: x86_64-unknown-linux-gnu
          install-linux-deps: "true"

      - name: Setup coverage and integration tools
        uses: ./.github/actions/setup-toolchain
        with:
          tools: aqua:taiki-e/cargo-llvm-cov godot

      - name: Install LLVM tools and headless display dependencies
        run: |
          mise exec -- rustup component add llvm-tools-preview
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Collect unit and Godot headless coverage
        shell: bash
        run: |
          target=x86_64-unknown-linux-gnu
          export CARGO_TARGET_DIR="$PWD/target/coverage-build"
          export LD_LIBRARY_PATH="${CEF_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          coverage_env="$(mise exec -- cargo llvm-cov show-env --sh --target "$target")"
          eval "$coverage_env"
          mise exec -- cargo llvm-cov clean --workspace
          mkdir -p target/coverage

          # Keep the instrumented objects for llvm-cov, including libgdcef.so.
          # This job never supplies binaries to the release packaging workflow.
          mise exec -- cargo xtask bundle --target "$target" --target-dir "$CARGO_TARGET_DIR"
          xvfb-run -a -s '-screen 0 1024x768x24' mise exec -- cargo xtask integration \
            --target "$target" --godot "$(mise which godot)" \
            --output target/coverage/integration

          report_args=(--target "$target" --ignore-filename-regex '(crates/gdcef_itest|benches)/')
          mise exec -- cargo llvm-cov report "${report_args[@]}" \
            --json --summary-only --output-path target/coverage/headless.json
          # Check this before unit tests: their hits cannot hide a missing DSO profile.
          jq -e '
            .data[0].files as $files |
            all(["cef_texture", "cef_texture2d"][];
              . as $class | any($files[];
                (.filename | endswith("crates/gdcef/src/" + $class + "/mod.rs")) and
                .summary.lines.covered > 0))
          ' target/coverage/headless.json

          mise exec -- cargo test --locked --workspace --all-features --target "$target"
          mise exec -- cargo llvm-cov report "${report_args[@]}" \
            --lcov --output-path target/coverage/lcov.info
          test -s target/coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: target/coverage/lcov.info
          disable_search: true
          plugins: noop
          flags: linux
          name: linux-unit-and-headless
          fail_ci_if_error: true

      - name: Upload coverage and integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux-x64
          path: |
            target/coverage/lcov.info
            target/coverage/headless.json
            target/coverage/integration/**/summary.json
            target/coverage/integration/**/junit.xml
            target/coverage/integration/**/result.json
            target/coverage/integration/**/godot.log
          retention-days: 14
          if-no-files-found: warn
