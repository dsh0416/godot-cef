name: Build
on:
  workflow_call:
    outputs:
      required-results:
        description: Results of required jobs (build-macos, build-windows, build-linux, pack).
        value: ${{ toJSON(jobs) }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CEF_PATH: ${{ github.workspace }}/cef
  # Incremental rustc invocations cannot be cached by sccache.
  CARGO_INCREMENTAL: "0"

jobs:
  build-macos:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-latest
    name: macOS

    env:
      CEF_PATH_ARM64: ${{ github.workspace }}/cef
      CEF_PATH_X64: ${{ github.workspace }}/cef-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          tools: rust export-cef-dir godot

      - name: Install Rust targets
        run: mise exec -- rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Cargo caches
        uses: ./.github/actions/setup-cargo-cache

      - name: Setup build scripts
        uses: ./.github/actions/setup-build-scripts

      - name: Setup CEF runtime (ARM64)
        uses: ./.github/actions/setup-cef
        with:
          target: aarch64-apple-darwin
          path: ${{ env.CEF_PATH_ARM64 }}

      - name: Setup CEF runtime (X64)
        uses: ./.github/actions/setup-cef
        with:
          target: x86_64-apple-darwin
          path: ${{ env.CEF_PATH_X64 }}

      - name: Build and bundle for macOS (Universal)
        env:
          RUSTC_WRAPPER: sccache
        run: mise run bundle --release

      - name: Validate macOS bundle
        run: |
          platform_path="$(mise exec -- node scripts/build/main.ts platform-dir --target universal-apple-darwin)"
          framework_path="$platform_path/Godot CEF.framework"
          plist_path="$framework_path/Resources/Info.plist"
          test "$(plutil -extract CFBundleExecutable raw "$plist_path")" = "libgdcef.dylib"
          test "$(plutil -extract CFBundleSupportedPlatforms.0 raw "$plist_path")" = "MacOSX"
          test -d "$framework_path/Helpers/Godot CEF.app"
          otool -arch arm64 -D "$framework_path/libgdcef.dylib" | grep -Fxq '@rpath/Godot CEF.framework/libgdcef.dylib'
          otool -arch x86_64 -D "$framework_path/libgdcef.dylib" | grep -Fxq '@rpath/Godot CEF.framework/libgdcef.dylib'
          find "$framework_path/Helpers" -path '*/Libraries/*.dylib' -exec codesign --verify --strict {} \;
          codesign --verify --deep --strict "$framework_path"
          codesign --verify --strict "$platform_path/libgdcef_bootstrap.dylib"
          bootstrap_dependencies="$(otool -L "$platform_path/libgdcef_bootstrap.dylib")"
          if grep -Ei 'libcef|Chromium Embedded Framework' <<< "$bootstrap_dependencies"; then exit 1; fi

      - name: Test native editor installation lifecycle
        timeout-minutes: 20
        run: |
          mise exec -- node tests/bootstrap/run.ts --addon addons/godot_cef \
            --godot "$(mise which godot)" --cef-source "$CEF_PATH_ARM64" \
            --cef-source-x64 "$CEF_PATH_X64" --output target/bootstrap-tests

      - name: Upload installer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-macos
          path: |
            target/bootstrap-tests/**/summary.json
            target/bootstrap-tests/**/*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Prepare artifacts
        run: |
          mise exec -- node scripts/build/main.ts stage-artifact --target universal-apple-darwin --output artifacts/universal-apple-darwin
          COPYFILE_DISABLE=1 tar -cf artifacts/gdcef-universal-apple-darwin.tar -C artifacts/universal-apple-darwin .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gdcef-universal-apple-darwin
          path: artifacts/gdcef-universal-apple-darwin.tar
          retention-days: 30

  build-windows:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    name: Windows (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust and CEF
        uses: ./.github/actions/setup-rust-cef
        with:
          target: ${{ matrix.target }}
          msvc-arch: ${{ matrix.msvc_arch }}

      - name: Build and bundle for Windows
        env:
          RUSTC_WRAPPER: sccache
        run: mise run bundle --release --target ${{ matrix.target }}

      - name: Setup installer test toolchain
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: ./.github/actions/setup-toolchain
        with:
          tools: godot

      - name: Test native editor installation lifecycle
        if: matrix.target == 'x86_64-pc-windows-msvc'
        timeout-minutes: 20
        shell: pwsh
        run: |
          $godot = mise which godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/bootstrap/run.ts --addon addons/godot_cef --godot "$godot" --cef-source "$env:CEF_PATH" --output target/bootstrap-tests

      - name: Upload installer evidence
        if: always() && matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-windows-x64
          path: |
            target/bootstrap-tests/**/summary.json
            target/bootstrap-tests/**/*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Prepare artifacts
        shell: pwsh
        run: |
          mise exec -- node scripts/build/main.ts stage-artifact --target ${{ matrix.target }} --output artifacts/${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -cf artifacts/gdcef-${{ matrix.target }}.tar -C artifacts/${{ matrix.target }} .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gdcef-${{ matrix.target }}
          path: artifacts/gdcef-${{ matrix.target }}.tar
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    name: Linux (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # PRs still build the native release bundle and run integration tests.
        # Full cross-platform packaging runs on main, tags, and manual runs.
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["x86_64-unknown-linux-gnu"]' || '["x86_64-unknown-linux-gnu","aarch64-unknown-linux-gnu"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust and CEF
        uses: ./.github/actions/setup-rust-cef
        with:
          target: ${{ matrix.target }}
          install-linux-deps: "true"

      - name: Validate integration runner failure handling
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: 'mise exec -- cargo test --locked -p xtask integration::'

      - name: Check native installer without CEF
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          CEF_PATH: /does-not-exist/godot-cef-bootstrap-check
          RUSTC_WRAPPER: sccache
        run: |
          mise exec -- cargo check --locked -p gdcef_bootstrap --target x86_64-unknown-linux-gnu
          dependencies="$(mise exec -- cargo tree --locked -p gdcef_bootstrap --prefix none --format '{p}')"
          if grep -Eq '^(cef|cef-dll-sys|cef_app) ' <<< "$dependencies"; then
            echo '::error::The installer must not link CEF or the browser core.'
            exit 1
          fi

      - name: Build and bundle for Linux
        env:
          RUSTC_WRAPPER: sccache
        run: mise run bundle --release --target ${{ matrix.target }}

      - name: Verify installer has no CEF loader dependency
        shell: bash
        run: |
          platform_path="$(mise exec -- node scripts/build/main.ts platform-dir --target '${{ matrix.target }}')"
          bootstrap_dependencies="$(readelf -d "$platform_path/libgdcef_bootstrap.so")"
          if grep -E 'NEEDED.*libcef' <<< "$bootstrap_dependencies"; then
            echo '::error::Native installer unexpectedly depends on libcef.'
            exit 1
          fi

      - name: Setup integration test toolchain
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: ./.github/actions/setup-toolchain
        with:
          tools: godot

      - name: Install headless display dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Test native editor installation lifecycle
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        timeout-minutes: 20
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' mise exec -- node tests/bootstrap/run.ts \
            --addon addons/godot_cef --godot "$(mise which godot)" \
            --cef-source "$CEF_PATH" --output target/bootstrap-tests

      - name: Upload installer evidence
        if: always() && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-linux-x64
          path: |
            target/bootstrap-tests/**/summary.json
            target/bootstrap-tests/**/*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Run Godot headless integration tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        timeout-minutes: 20
        env:
          RUSTC_WRAPPER: sccache
        run: |
          # Xvfb supplies CEF's X11 backend; Godot itself uses its dummy renderer.
          # Reuse the complete native bundle above and build only the test addon.
          # The fresh Xvfb server provides a disposable clipboard for these cases.
          xvfb-run -a -s '-screen 0 1024x768x24' mise exec -- cargo xtask integration \
            --release --target x86_64-unknown-linux-gnu --allow-clipboard-writes \
            --godot "$(mise which godot)"

      - name: Upload integration evidence
        if: always() && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: integration-linux-x64
          path: |
            target/integration/**/summary.json
            target/integration/**/junit.xml
            target/integration/**/result.json
            target/integration/**/godot.log
          retention-days: 14
          if-no-files-found: warn

      - name: Prepare artifacts
        run: |
          mise exec -- node scripts/build/main.ts stage-artifact --target ${{ matrix.target }} --output artifacts/${{ matrix.target }}
          tar -cf artifacts/gdcef-${{ matrix.target }}.tar -C artifacts/${{ matrix.target }} .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gdcef-${{ matrix.target }}
          path: artifacts/gdcef-${{ matrix.target }}.tar
          retention-days: 30

  pack:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    name: Pack Addon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup build scripts
        uses: ./.github/actions/setup-build-scripts

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gdcef-*
          path: downloaded-artifacts

      - name: Restore native permissions and framework links
        run: |
          # GitHub's ZIP transport resets modes; the inner tar preserves modes,
          # relative framework links, and hidden installation receipts.
          for target in universal-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mkdir -p "artifacts/gdcef-$target"
            tar -xf "downloaded-artifacts/gdcef-$target/gdcef-$target.tar" -C "artifacts/gdcef-$target"
          done

      - name: Pack full and Asset Store addons
        run: |
          # Stage each variant independently; both ZIPs retain the existing dist/addons layout.
          for variant in full store; do
            mise run pack \
              --artifacts artifacts \
              --output staging/$variant/dist/addons/godot_cef \
              --addon-src addons/godot_cef \
              --variant "$variant"
            mise run validate \
              --addon staging/$variant/dist/addons/godot_cef --variant "$variant"
          done
          (cd staging/full && zip -ry ../../godot_cef.zip dist)
          (cd staging/store && zip -ry ../../godot_cef-store.zip dist)

      - name: Upload full addon
        uses: actions/upload-artifact@v7
        with:
          name: godot_cef-addon
          path: godot_cef.zip
          retention-days: 30

      - name: Upload Asset Store addon
        uses: actions/upload-artifact@v7
        with:
          name: godot_cef-store-addon
          path: godot_cef-store.zip
          retention-days: 30
