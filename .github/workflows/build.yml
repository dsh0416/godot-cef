name: Build
on:
  workflow_call:
    outputs:
      required-results:
        description: Results of required jobs (build-macos, build-windows, build-linux, pack).
        value: ${{ toJSON(jobs) }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CEF_PATH: ${{ github.workspace }}/cef
  # Incremental rustc invocations cannot be cached by sccache.
  CARGO_INCREMENTAL: "0"

jobs:
  build-macos:
    runs-on: macos-latest
    name: macOS

    env:
      CEF_PATH_ARM64: ${{ github.workspace }}/cef
      CEF_PATH_X64: ${{ github.workspace }}/cef-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          tools: rust cargo:export-cef-dir

      - name: Install Rust targets
        run: mise exec -- rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Cargo caches
        uses: ./.github/actions/setup-cargo-cache

      - name: Setup CEF runtime (ARM64)
        uses: ./.github/actions/setup-cef
        with:
          target: aarch64-apple-darwin
          path: ${{ env.CEF_PATH_ARM64 }}

      - name: Setup CEF runtime (X64)
        uses: ./.github/actions/setup-cef
        with:
          target: x86_64-apple-darwin
          path: ${{ env.CEF_PATH_X64 }}

      - name: Build and bundle for macOS (Universal)
        env:
          RUSTC_WRAPPER: sccache
        run: mise exec -- cargo xtask bundle --release

      - name: Validate macOS bundle
        run: |
          framework_path="addons/godot_cef/bin/universal-apple-darwin/Godot CEF.framework"
          plist_path="$framework_path/Resources/Info.plist"
          test "$(plutil -extract CFBundleExecutable raw "$plist_path")" = "libgdcef.dylib"
          test "$(plutil -extract CFBundleSupportedPlatforms.0 raw "$plist_path")" = "MacOSX"
          test -d "$framework_path/Helpers/Godot CEF.app"
          otool -arch arm64 -D "$framework_path/libgdcef.dylib" | grep -Fxq '@rpath/Godot CEF.framework/libgdcef.dylib'
          otool -arch x86_64 -D "$framework_path/libgdcef.dylib" | grep -Fxq '@rpath/Godot CEF.framework/libgdcef.dylib'
          find "$framework_path/Helpers" -path '*/Libraries/*.dylib' -exec codesign --verify --strict {} \;
          codesign --verify --deep --strict "$framework_path"

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/universal-apple-darwin
          cp -R "target/release/Godot CEF.framework" "artifacts/universal-apple-darwin/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gdcef-universal-apple-darwin
          path: artifacts/universal-apple-darwin
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    name: Windows (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust and CEF
        uses: ./.github/actions/setup-rust-cef
        with:
          target: ${{ matrix.target }}
          msvc-arch: ${{ matrix.msvc_arch }}

      - name: Build and bundle for Windows
        env:
          RUSTC_WRAPPER: sccache
        run: mise exec -- cargo xtask bundle --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/${{ matrix.target }}
          Copy-Item -Recurse addons/godot_cef/bin/${{ matrix.target }}/* artifacts/${{ matrix.target }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gdcef-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    name: Linux (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust and CEF
        uses: ./.github/actions/setup-rust-cef
        with:
          target: ${{ matrix.target }}
          install-linux-deps: "true"

      - name: Validate integration runner failure handling
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: 'mise exec -- cargo test --locked -p xtask integration::'

      - name: Build and bundle for Linux
        env:
          RUSTC_WRAPPER: sccache
        run: mise exec -- cargo xtask bundle --release --target ${{ matrix.target }}

      - name: Setup integration test toolchain
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: ./.github/actions/setup-toolchain
        with:
          tools: godot

      - name: Install headless display dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Run Godot headless integration tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        timeout-minutes: 20
        env:
          RUSTC_WRAPPER: sccache
        run: |
          # Xvfb supplies CEF's X11 backend; Godot itself uses its dummy renderer.
          # Reuse the complete native bundle above and build only the test addon.
          xvfb-run -a -s '-screen 0 1024x768x24' mise exec -- cargo xtask integration \
            --release --target x86_64-unknown-linux-gnu \
            --godot "$(mise which godot)"

      - name: Upload integration evidence
        if: always() && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: integration-linux-x64
          path: |
            target/integration/**/summary.json
            target/integration/**/junit.xml
            target/integration/**/result.json
            target/integration/**/godot.log
          retention-days: 14
          if-no-files-found: warn

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/${{ matrix.target }}
          cp -r addons/godot_cef/bin/${{ matrix.target }}/* artifacts/${{ matrix.target }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gdcef-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}
          retention-days: 30

  pack:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    name: Pack Addon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup mise toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          tools: rust

      - name: Setup Cargo caches
        uses: ./.github/actions/setup-cargo-cache

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: gdcef-*
          path: artifacts

      - name: Pack full and Asset Store addons
        env:
          RUSTC_WRAPPER: sccache
        run: |
          # Stage each variant independently; both ZIPs retain the existing dist/addons layout.
          for variant in full store; do
            mise exec -- cargo xtask pack \
              --artifacts artifacts \
              --output staging/$variant/dist/addons/godot_cef \
              --addon-src addons/godot_cef \
              --variant "$variant"
            mise exec -- cargo xtask validate \
              --addon staging/$variant/dist/addons/godot_cef --variant "$variant"
          done
          (cd staging/full && zip -r ../../godot_cef.zip dist)
          (cd staging/store && zip -r ../../godot_cef-store.zip dist)

      - name: Upload full addon
        uses: actions/upload-artifact@v7
        with:
          name: godot_cef-addon
          path: godot_cef.zip
          retention-days: 30

      - name: Upload Asset Store addon
        uses: actions/upload-artifact@v7
        with:
          name: godot_cef-store-addon
          path: godot_cef-store.zip
          retention-days: 30
