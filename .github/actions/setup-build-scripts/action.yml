name: Setup TypeScript build scripts
description: Install Node and the isolated build package, without documentation dependencies.

runs:
  using: composite
  steps:
    - name: Setup Node and pnpm
      uses: ./.github/actions/setup-toolchain
      with:
        tools: node pnpm

    - name: Locate build package store
      id: store
      shell: bash
      run: echo "path=$(mise exec -- pnpm --dir scripts/build store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore build package cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: godot-cef-build-scripts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/pnpm-lock.yaml', 'mise.lock') }}

    - name: Install locked build dependencies
      shell: bash
      run: mise exec -- pnpm --dir scripts/build install --frozen-lockfile --prod

    - name: Save build package cache
      if: ${{ steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: ${{ steps.cache.outputs.cache-primary-key }}
