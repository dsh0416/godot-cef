name: Setup Cargo caches
description: Cache Cargo dependencies and configure the shared compiler cache.

inputs:
  cache-targets:
    description: Cache compiled dependencies for checks; leave off for packaging.
    required: false
    default: "false"
  target:
    description: Target triple used to separate compiled dependency caches.
    required: false
    default: host

runs:
  using: composite
  steps:
    - name: Restore Cargo dependencies
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: godot-cef-cargo-v2-${{ runner.os }}-${{ runner.arch }}
        shared-key: ${{ inputs.cache-targets == 'true' && format('checks-{0}', inputs.target) || 'downloads' }}
        key: ${{ hashFiles('mise.toml', 'mise.lock') }}
        env-vars: CEF_VERSION CEF_PATH
        cache-targets: ${{ inputs.cache-targets }}
        cache-bin: "false"
        save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

    - name: Configure shared compiler cache
      shell: bash
      env:
        CACHE_RW_MODE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_RW_MODE=$CACHE_RW_MODE" >> "$GITHUB_ENV"

    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.18.0
