name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Do not interrupt tagged releases or Pages deployments.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Preflight
    # Tag pushes package only; manual runs still run all checks.
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/preflight.yml

  test:
    name: Test
    needs: [preflight]
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      # The Linux x64 test uploads coverage to Codecov with GitHub OIDC.
      id-token: write
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    needs: [preflight]
    # Tag pushes intentionally skip preflight but still need full packages.
    if: ${{ !cancelled() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || needs.preflight.result == 'success') }}
    uses: ./.github/workflows/build.yml

  docs:
    name: Documentation
    needs: [preflight]
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/deploy-docs.yml

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [preflight, test, build, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI work
        shell: bash
        env:
          TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PREFLIGHT_JOBS: ${{ needs.preflight.outputs.required-results }}
          TEST_JOBS: ${{ needs.test.outputs.required-results }}
          BUILD_JOBS: ${{ needs.build.outputs.required-results }}
          DOCS_JOBS: ${{ needs.docs.outputs.required-results }}
        run: |
          # Explicit job results also reject an unexpected skip inside a reusable
          # workflow, even if its overall result is reported as success.
          require_jobs() {
            if ! jq -e --argjson required "$3" --arg expected "${4:-success}" \
              '. as $jobs | all($required[]; $jobs[.].result == $expected)' <<< "$2" >/dev/null; then
              echo "::error::$1 contains work that did not have the expected result (${4:-success}): $2"
              exit 1
            fi
          }

          if [[ "$TAG_PUSH" == "true" ]]; then
            if [[ "$PREFLIGHT_RESULT" != "skipped" ]]; then
              echo "::error::Tag pushes must skip preflight (Preflight: $PREFLIGHT_RESULT)."
              exit 1
            fi
          else
            if [[ "$PREFLIGHT_RESULT" != "success" ]]; then
              echo "::error::Preflight checks did not succeed (Preflight: $PREFLIGHT_RESULT)."
              exit 1
            fi
            require_jobs Preflight "$PREFLIGHT_JOBS" '["fmt","validate-versions"]'
          fi

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "::error::Required build work did not succeed (Build: $BUILD_RESULT)."
            exit 1
          fi
          if [[ "$PULL_REQUEST" == "true" ]]; then
            require_jobs Build "$BUILD_JOBS" '["build-linux"]'
            require_jobs Build "$BUILD_JOBS" '["build-macos","build-windows","pack"]' skipped
          else
            require_jobs Build "$BUILD_JOBS" '["build-macos","build-windows","build-linux","pack"]'
          fi

          if [[ "$TAG_PUSH" == "true" ]]; then
            if [[ "$TEST_RESULT" != "skipped" || "$DOCS_RESULT" != "skipped" ]]; then
              echo "::error::Unexpected tag-push results (Test: $TEST_RESULT, Documentation: $DOCS_RESULT)."
              exit 1
            fi
          else
            if [[ "$TEST_RESULT" != "success" || "$DOCS_RESULT" != "success" ]]; then
              echo "::error::Required checks did not succeed (Test: $TEST_RESULT; Documentation: $DOCS_RESULT)."
              exit 1
            fi
            require_jobs Test "$TEST_JOBS" '["test","clippy"]'
            require_jobs Documentation "$DOCS_JOBS" '["build"]'
          fi

  release:
    needs: [gate]
    runs-on: ubuntu-latest
    name: Publish Release
    if: ${{ !cancelled() && needs.gate.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}

    permissions:
      contents: write

    steps:
      - name: Download packed addon
        uses: actions/download-artifact@v8
        with:
          name: godot_cef-addon
          path: .

      - name: Download Asset Store addon
        uses: actions/download-artifact@v8
        with:
          name: godot_cef-store-addon
          path: .

      - name: Rename addons with version
        run: |
          mv godot_cef.zip godot_cef-${{ github.ref_name }}.zip
          mv godot_cef-store.zip godot_cef-store-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Godot CEF ${{ github.ref_name }}
          draft: true # release is draft until it is manually published
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            godot_cef-${{ github.ref_name }}.zip
            godot_cef-store-${{ github.ref_name }}.zip

  deploy-docs:
    if: ${{ !cancelled() && needs.gate.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    name: Deploy documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [gate]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
