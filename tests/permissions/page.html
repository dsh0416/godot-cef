<!doctype html>
<meta charset="utf-8">
<title>Godot CEF permission integration</title>
<h1>Fake camera and microphone permission fixture</h1>
<p>This page uses synthetic media devices and reports only to its loopback origin.</p>
<script>
  const run = new URL(location.href).searchParams.get("run");
  const report = (event) => fetch(`/event?run=${encodeURIComponent(run)}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(event),
    keepalive: true,
  });
  let attempts = 0;
  window.requestPermissionFixture = async () => {
    const attempt = ++attempts;
    if (!isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      await report({ type: "unsupported", attempt, secureContext: isSecureContext });
      return;
    }
    await report({ type: "started", attempt });
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      const tracks = stream.getTracks().map((track) => ({ kind: track.kind, label: track.label }));
      stream.getTracks().forEach((track) => track.stop());
      await report({ type: "media", attempt, result: "resolved", tracks });
    } catch (error) {
      await report({ type: "media", attempt, result: "rejected", name: error.name, message: error.message });
    }
  };
  const initial = location.pathname === "/blank"
    ? report({ type: "navigated" })
    : window.requestPermissionFixture();
  initial.catch((error) => report({ type: "fixture_error", message: String(error) }));
</script>
