name: Documentation

on:
  workflow_call:
    outputs:
      required-results:
        description: Results of required jobs (build).
        value: ${{ toJSON(jobs) }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          tools: node pnpm

      - name: Locate pnpm store
        id: pnpm-cache-path
        run: echo "store=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-cache-path.outputs.store }}
          key: godot-cef-pnpm-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: |
            godot-cef-pnpm-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}-

      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Save pnpm store
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-cache-path.outputs.store }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Build documentation
        run: mise exec -- pnpm docs:build

      - name: Add .nojekyll file
        run: touch docs/.vitepress/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
