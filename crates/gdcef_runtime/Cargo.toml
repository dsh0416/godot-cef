repository.workspace = true

[features]
default = []
installer = ["dep:download-cef", "dep:ureq", "dep:sha1_smol", "dep:bzip2"]

[dependencies]
serde = { workspace = true }
serde_json = "1"
flate2 = "1"
tar = "0.4"
