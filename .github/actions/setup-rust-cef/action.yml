name: Setup Rust and CEF
description: Install toolchain components, cache Cargo/CEF assets, and download CEF for one target.

inputs:
  target:
    description: Rust target triple to install and download CEF for.
    required: true
  cache-rust-build:
    description: Cache compiled Cargo dependencies for test and Clippy jobs.
    required: false
    default: "false"
  msvc-arch:
    description: MSVC developer prompt architecture for Windows runners.
    required: false
    default: ""
  install-clippy:
    description: Install the clippy component before building.
    required: false
    default: "false"
  install-linux-deps:
    description: Install Linux build dependencies on Linux runners.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install system dependencies (Linux)
      if: ${{ inputs.install-linux-deps == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libgtk-3-dev \
          libnss3-dev \
          libatk1.0-dev \
          libatk-bridge2.0-dev \
          libcups2-dev \
          libdrm-dev \
          libxkbcommon-dev \
          libxcomposite-dev \
          libxdamage-dev \
          libxrandr-dev \
          libgbm-dev \
          libpango1.0-dev \
          libasound2-dev \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu

    - name: Setup mise toolchain
      uses: ./.github/actions/setup-toolchain
      with:
        tools: rust cargo:export-cef-dir

    - name: Install Clippy component
      if: ${{ inputs.install-clippy == 'true' }}
      shell: bash
      run: mise exec -- rustup component add clippy

    - name: Install Rust target
      shell: bash
      run: mise exec -- rustup target add "${{ inputs.target }}"

    - name: Select MSVC toolchain
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ inputs.msvc-arch }}

    - name: Setup Cargo caches
      uses: ./.github/actions/setup-cargo-cache
      with:
        target: ${{ inputs.target }}
        cache-targets: ${{ inputs.cache-rust-build }}

    - name: Setup CEF runtime
      uses: ./.github/actions/setup-cef
      with:
        target: ${{ inputs.target }}
        path: ${{ env.CEF_PATH }}
