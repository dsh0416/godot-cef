<!doctype html>
<meta charset="utf-8">
<title>Godot CEF editing fixture</title>
<style>
  body { margin: 0; }
  #editor { position: absolute; left: 16px; top: 16px; width: 400px; height: 120px; }
</style>
<textarea id="editor" aria-label="Keyboard editing target"></textarea>
<script>
  const params = new URL(location.href).searchParams;
  const run = params.get('run');
  const generation = Number(params.get('generation'));
  const report = (event) => fetch(`/event?run=${encodeURIComponent(run)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({generation, ...event}), keepalive: true,
  }).then((response) => {
    if (!response.ok) throw new Error(`Fixture report failed: ${response.status}`);
  });
  const fail = (error) => report({type: 'fixture_error', message: String(error)});
  const editor = document.getElementById('editor');
  const clipboardText = 'gdcef-clipboard:✓';
  const seeds = ['', 'alphaomega', 'alphaomega', 'select me', clipboardText,
                 'before:after', 'custom editor', 'blocked paste', 'restore clipboard'];
  const knownValues = new Set([...seeds, 'alpha\nomega', `before:${clipboardText}after`]);
  let phase = -1;
  let events = [];
  let clipboardEvents = [];
  let customActions = 0;
  let savedClipboard = null;
  let clipboardRestorable = false;
  window.prepareKeyboardEditing = (next) => {
    phase = next;
    events = [];
    clipboardEvents = [];
    customActions = 0;
    editor.value = seeds[phase];
    editor.focus();
    const cursor = phase === 1 || phase === 2 ? 5 : phase === 5 ? 7 : 0;
    editor.setSelectionRange(cursor, phase === 4 || phase === 8 ? editor.value.length : cursor);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      report({type: 'editing_focus', phase, target: document.activeElement.id}).catch(fail);
    }));
  };
  for (const type of ['copy', 'paste']) {
    editor.addEventListener(type, (event) => {
      clipboardEvents.push({type, trusted: event.isTrusted});
      if (phase === 0 && type === 'paste') {
        // Keep existing string clipboard formats entirely inside the page. They
        // never appear in reports; restore them after testing the real clipboard.
        event.preventDefault();
        clipboardRestorable = event.clipboardData.files.length === 0;
        savedClipboard = Array.from(event.clipboardData.types,
          (type) => [type, event.clipboardData.getData(type)]);
      } else if (phase === 8 && type === 'copy') {
        event.preventDefault();
        for (const [type, data] of savedClipboard.length ? savedClipboard : [['text/plain', '']]) {
          event.clipboardData.setData(type, data);
        }
      }
    });
  }
  const completed = () => {
    if (phase === 0) return savedClipboard !== null;
    if (phase === 1 || phase === 2) return editor.value === 'alpha\nomega';
    if (phase === 3) return editor.selectionStart === 0 && editor.selectionEnd === editor.value.length;
    if (phase === 4 || phase === 8) return clipboardEvents.some((event) => event.type === 'copy');
    if (phase === 5) return editor.value === `before:${clipboardText}after`;
    return customActions === 1;
  };
  for (const type of ['keydown', 'keyup']) {
    editor.addEventListener(type, (event) => {
      events.push({type, key: event.key, code: event.code, keyCode: event.keyCode,
                   repeat: event.repeat, trusted: event.isTrusted,
                   ctrl: event.ctrlKey, meta: event.metaKey});
      // Simulate an editor's own shortcut dispatch. A direct Frame.select_all()
      // or Frame.paste() before DOM handling must fail these phases.
      if (type === 'keydown' && (event.ctrlKey || event.metaKey)
          && ((phase === 6 && event.code === 'KeyA') || (phase === 7 && event.code === 'KeyV'))) {
        event.preventDefault();
        customActions++;
        if (phase === 6) editor.setSelectionRange(2, 6);
      }
      if (type === 'keyup') {
        const started = performance.now();
        const finish = () => {
          const elapsed = performance.now() - started;
          if (elapsed < 100 || (!completed() && elapsed < 1000)) {
            requestAnimationFrame(finish);
            return;
          }
          // A failed copy must not expose pre-existing clipboard contents when
          // the following paste produces an unexpected value.
          const value = knownValues.has(editor.value) ? editor.value : '[unexpected text redacted]';
          report({type: 'editing_result', phase, value,
                  start: editor.selectionStart, end: editor.selectionEnd,
                  events: [...events], clipboardEvents: [...clipboardEvents],
                  customActions, clipboardRestorable}).catch(fail);
        };
        requestAnimationFrame(finish);
      }
    });
  }
  window.addEventListener('load', () => {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      report({type: 'editing_ready'}).catch(fail);
    }));
  });
</script>
